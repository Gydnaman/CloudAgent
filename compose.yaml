services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: cloudagent
      POSTGRES_USER: cloudagent
      POSTGRES_PASSWORD: cloudagent-local-demo
    volumes:
      - cloudagent_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudagent -d cloudagent"]
      interval: 2s
      timeout: 2s
      retries: 15
  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      MAX_ACTIVE_RUNS: ${MAX_ACTIVE_RUNS:-4}
      MAX_SESSIONS: ${MAX_SESSIONS:-100}
      MAX_RUNS: ${MAX_RUNS:-1000}
      DATABASE_URL: postgresql+psycopg_async://cloudagent:cloudagent-local-demo@db:5432/cloudagent
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 8
    init: true
volumes:
  cloudagent_pg:
